version: '3.8'

services:
  dragonfly-staging:
    image: docker.dragonflydb.io/dragonflydb/dragonfly:latest
    container_name: dragonfly-staging
    command:
      # Authentication
      - --requirepass=${DRAGONFLY_ROOT_PASSWORD}
      
      # Data persistence
      - --dir=/data
      - --dbfilename=dump
      - --snapshot_cron=0 */6 * * *  # Snapshot every 6 hours
      
      # Memory management - TESTING THESE PARAMETERS
      - --cache_mode=true
      - --maxmemory=50gb
      
      # Performance tuning
      - --proactor_threads=8
      - --primary_port_http_enabled=true
      
      # Logging
      - --logtostderr
      - --vmodule=*=1  # 0=ERROR, 1=WARNING, 2=INFO, 3=DEBUG
      
      # Network
      - --tls=false
    ports:
      - "6380:6379"  # Map to different external port to avoid conflict
    volumes:
      - /tmp/dragonfly-staging-data:/data
    restart: "no"  # Manual control for testing
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${DRAGONFLY_ROOT_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    ulimits:
      memlock: -1
      nofile:
        soft: 65536
        hard: 65536
    # Resource limits - TESTING THESE PARAMETERS
    deploy:
      resources:
        limits:
          memory: 55gb
        reservations:
          memory: 50gb




