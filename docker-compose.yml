version: '3.8'

x-logging: &default-logging
  driver: journald
  options:
    tag: "{{.Name}}"

services:
  dragonfly:
    image: docker.dragonflydb.io/dragonflydb/dragonfly:v1.34.2
    container_name: dragonfly
    command:
      - --requirepass=${DRAGONFLY_ROOT_PASSWORD}
      - --dir=/data
      - --dbfilename=dump
      - --snapshot_cron=0 */6 * * *  # Snapshot every 6 hours
      - --cache_mode=true
      - --maxmemory=50gb
      - --proactor_threads=8
      - --primary_port_http_enabled=true
      - --logtostderr
      - --vmodule=*=1  # 0=ERROR, 1=WARNING, 2=INFO, 3=DEBUG
      - --tls=false  # Nginx handles TLS
    volumes:
      - /mnt/HC_Volume_103551069/dragonfly-data:/data
    restart: unless-stopped
    logging: *default-logging
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${DRAGONFLY_ROOT_PASSWORD}", "ping"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    ulimits:
      memlock: -1
      nofile:
        soft: 65536
        hard: 65536
    deploy:
      resources:
        limits:
          memory: 55gb
        reservations:
          memory: 50gb

  nginx:
    image: nginx:alpine
    container_name: dragonfly-nginx
    ports:
      - "80:80"
      - "443:443"
      - "6379:6379"  # Redis/Dragonfly with TLS
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      dragonfly:
        condition: service_healthy
    restart: always
    logging: *default-logging

  backup:
    image: mazzolino/restic
    container_name: dragonfly-backup
    hostname: dragonfly-backup
    environment:
      - RESTIC_REPOSITORY=s3:https://hel1.your-objectstorage.com/yral-dragonfly-backup
      - RESTIC_PASSWORD=${RESTIC_PASSWORD}
      - AWS_ACCESS_KEY_ID=${HETZNER_S3_ACCESS_KEY}
      - AWS_SECRET_ACCESS_KEY=${HETZNER_S3_SECRET_KEY}
      - BACKUP_CRON=0 3 * * *  # Daily at 3 AM
      - RESTIC_BACKUP_SOURCES=/data
      - RESTIC_BACKUP_ARGS=--tag dragonfly --tag automated
      - RESTIC_FORGET_ARGS=--keep-daily 7 --keep-weekly 4 --keep-monthly 6
      - TZ=UTC
    volumes:
      - /mnt/HC_Volume_103551069/dragonfly-data:/data:ro
    restart: always
    logging: *default-logging
