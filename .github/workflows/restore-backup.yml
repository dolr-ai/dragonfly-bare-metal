name: Restore Dragonfly from Backup

on:
  workflow_dispatch:
    inputs:
      snapshot_id:
        description: 'Snapshot ID to restore (e.g., "latest" or specific snapshot ID like "a1b2c3d4")'
        required: true
        default: 'latest'

jobs:
  prepare:
    name: Prepare server matrix
    runs-on: ubuntu-latest
    outputs:
      server_matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Set server matrix
        id: set-matrix
        run: |
          SERVER_IPS="${{ vars.DRAGONFLY_DEPLOY_TARGET_SERVER_IPS }}"
          if [[ -z "$SERVER_IPS" ]]; then
            echo "Error: No server IPS provided. Set DRAGONFLY_DEPLOY_TARGET_SERVER_IPS variable."
            exit 1
          fi
          IFS=',' read -ra ADDR <<< "$SERVER_IPS"
          MATRIX="["
          for i in "${ADDR[@]}"; do
            IP=$(echo "$i" | xargs)
            if [[ -n "$IP" ]]; then
              MATRIX="$MATRIX\"$IP\","
            fi
          done
          MATRIX="${MATRIX%,}]"
          echo "matrix=$MATRIX" >> $GITHUB_OUTPUT

  restore:
    name: Restore Dragonfly Database
    runs-on: ubuntu-latest
    needs: prepare
    strategy:
      matrix:
        server_ip: ${{ fromJson(needs.prepare.outputs.server_matrix) }}
      fail-fast: false

    steps:
      - name: Validate inputs
        run: |
          echo "Snapshot ID: ${{ github.event.inputs.snapshot_id }}"
          echo "Server IP: ${{ matrix.server_ip }}"

          if [[ -z "${{ github.event.inputs.snapshot_id }}" ]]; then
            echo "Error: Snapshot ID is required"
            exit 1
          fi

      - name: Setup SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.HETZNER_BARE_METAL_GITHUB_ACTIONS_SSH_PRIVATE_KEY }}

      - name: Add server to known hosts
        run: |
          ssh-keyscan -H ${{ matrix.server_ip }} >> ~/.ssh/known_hosts

      - name: Check server connectivity
        run: |
          ssh -o ConnectTimeout=10 root@${{ matrix.server_ip }} "echo 'Server connection successful'"

      - name: List available snapshots
        run: |
          ssh root@${{ matrix.server_ip }} "
            cd /opt/dragonfly
            echo '========================================='
            echo 'Available Restic Snapshots:'
            echo '========================================='
            docker compose run --rm backup snapshots --compact
            echo ''
            echo 'Restoring snapshot: ${{ github.event.inputs.snapshot_id }}'
            echo '========================================='
          "

      - name: Confirm restore operation
        run: |
          echo "⚠️  WARNING: This will stop Dragonfly and restore from backup!"
          echo "Snapshot: ${{ github.event.inputs.snapshot_id }}"
          echo "Server: ${{ matrix.server_ip }}"
          echo ""
          echo "Proceeding with restore..."

      - name: Stop Dragonfly service
        run: |
          ssh root@${{ matrix.server_ip }} "
            cd /opt/dragonfly
            echo 'Stopping Dragonfly service...'
            docker compose stop dragonfly
            echo 'Service stopped'
          "

      - name: Restore data from backup
        run: |
          ssh root@${{ matrix.server_ip }} "
            cd /opt/dragonfly
            echo 'Starting restore process...'

            # Create temporary restore directory
            RESTORE_DIR='/tmp/restic-restore'
            rm -rf \${RESTORE_DIR}
            mkdir -p \${RESTORE_DIR}

            # Restore snapshot to temporary directory
            echo 'Restoring snapshot ${{ github.event.inputs.snapshot_id }}...'
            docker compose run --rm \
              -v \${RESTORE_DIR}:/restore \
              backup \
              restore ${{ github.event.inputs.snapshot_id }} --target /restore

            # Backup current data (just in case)
            echo 'Creating safety backup of current data...'
            BACKUP_DIR='/mnt/HC_Volume_103551069/dragonfly-data-before-restore-$(date +%Y%m%d-%H%M%S)'
            cp -a /mnt/HC_Volume_103551069/dragonfly-data \${BACKUP_DIR} || true
            echo \"Safety backup created at: \${BACKUP_DIR}\"

            # Clear existing data and restore
            echo 'Clearing existing data...'
            rm -rf /mnt/HC_Volume_103551069/dragonfly-data/*

            echo 'Restoring data from snapshot...'
            cp -a \${RESTORE_DIR}/data/* /mnt/HC_Volume_103551069/dragonfly-data/

            # Cleanup
            echo 'Cleaning up temporary files...'
            rm -rf \${RESTORE_DIR}

            echo 'Restore completed successfully!'
          "

      - name: Start Dragonfly service
        run: |
          ssh root@${{ matrix.server_ip }} "
            cd /opt/dragonfly
            echo 'Starting Dragonfly service...'
            docker compose up -d dragonfly
            echo 'Waiting for service to be healthy...'
            sleep 15
            docker compose ps
          "

      - name: Verify restoration
        run: |
          ssh root@${{ matrix.server_ip }} "
            cd /opt/dragonfly
            echo ''
            echo '========================================='
            echo 'Restoration Verification'
            echo '========================================='
            echo ''
            echo '=== Docker Containers Status ==='
            docker compose ps
            echo ''
            echo '=== Checking Dragonfly Health ==='
            docker compose exec -T dragonfly redis-cli -a \$DRAGONFLY_ROOT_PASSWORD ping || echo 'Dragonfly not yet healthy (may need more time)'
            echo ''
            echo '=== Recent Container Logs ==='
            docker compose logs --tail=20 dragonfly
            echo ''
            echo '========================================='
            echo 'Restore verification completed'
            echo '========================================='
          "

      - name: Restore summary
        run: |
          echo "## Restore Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Server**: ${{ matrix.server_ip }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Snapshot**: ${{ github.event.inputs.snapshot_id }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Status**: Completed" >> $GITHUB_STEP_SUMMARY
          echo "- **Action**: Dragonfly restarted with restored data" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Next Steps" >> $GITHUB_STEP_SUMMARY
          echo "1. Verify data integrity in Dragonfly" >> $GITHUB_STEP_SUMMARY
          echo "2. Check application connectivity" >> $GITHUB_STEP_SUMMARY
          echo "3. Monitor logs for any issues" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Safety Note" >> $GITHUB_STEP_SUMMARY
          echo "A backup of the previous data was created before restore." >> $GITHUB_STEP_SUMMARY
          echo "Check /mnt/HC_Volume_103551069/dragonfly-data-before-restore-* if needed." >> $GITHUB_STEP_SUMMARY
